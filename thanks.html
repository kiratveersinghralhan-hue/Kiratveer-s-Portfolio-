<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Kiratveer Studio</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#070604;--card:#15120d;--gold:#f5d47b;--text:#fff8e7;--muted:#bdb4a5;--line:rgba(245,212,123,.25)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(245,212,123,.16),transparent 32%),linear-gradient(135deg,#050403,#0f0c08);font-family:Inter,Arial,sans-serif;color:var(--text)}
    .card{width:min(760px,100%);padding:38px 26px;border:1px solid var(--line);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:0 24px 80px rgba(0,0,0,.45);text-align:center}
    .eyebrow{letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:900;font-size:13px}
    h1{font-size:clamp(42px,10vw,82px);line-height:.95;margin:14px 0 18px}
    p{color:var(--muted);font-size:18px;line-height:1.65;margin:0 auto 22px;max-width:620px}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:999px;text-decoration:none;font-weight:900}
    .primary{background:linear-gradient(135deg,#fff1aa,#c79535);color:#0d0a06}
    .dark{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.04)}
    .note{font-size:14px;color:#9f9688;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Request received</div>
    <h1>Thank you.</h1>
    <p>Your inquiry has been sent successfully. You will get a reply within <b>12–24 hours</b> on WhatsApp or email.</p>
    <p>For urgent work, message directly on WhatsApp: <b>+91 98148 00017</b>.</p>
    <div class="btns">
      <a class="primary" href="index.html">Back to Portfolio</a>
      <a class="dark" href="https://wa.me/919814800017">WhatsApp Now</a>
    </div>
    <div class="note">Kiratveer Studio — Video editing, design and websites.</div>
  </main>
</body>
</html>
