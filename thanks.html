  <style>
    :root{--bg:#050909;--paper:#f4eee5;--muted:#98aaa5;--teal:#29c7aa;--red:#e34856;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box;margin:0;padding:0}html{min-height:100%;background:var(--bg);max-width:100%;overflow-x:hidden}body{min-height:100vh;background:radial-gradient(circle at 50% 42%,rgba(41,199,170,.24),transparent 24%),radial-gradient(circle at 75% 70%,rgba(227,72,86,.2),transparent 24%),#050909;color:#fff;font-family:"DM Sans",sans-serif;display:grid;place-items:center;overflow-x:hidden;overflow-y:auto;max-width:100%}
    a{color:inherit;text-decoration:none}.grain{position:fixed;inset:0;opacity:.045;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.beam{position:fixed;inset:-20%;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.12) 46%,transparent 58%);animation:beam 4s 1s var(--ease) infinite}.wrap{width:min(980px,calc(100% - 30px));position:relative;z-index:1;text-align:center;padding:60px 0}.mark{position:relative;width:102px;height:102px;border-radius:30px;margin:0 auto 34px;padding:8px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.18);box-shadow:0 26px 90px rgba(41,199,170,.24);animation:markIn .9s var(--ease) both}.mark:before,.mark:after{content:"";position:absolute;inset:-15px;border-radius:36px;border:1px solid rgba(41,199,170,.24);animation:pulse 2.5s ease-in-out infinite}.mark:after{inset:-30px;border-color:rgba(227,72,86,.18);animation-delay:.3s}.mark img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}.check{position:absolute;right:-10px;bottom:-10px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#05110e;font-weight:800;box-shadow:0 14px 36px rgba(41,199,170,.34);animation:checkIn .62s .65s var(--ease) both}
    .eyebrow{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);animation:fadeUp .75s .18s both}.wrap h1{font:800 clamp(3.4rem,9.2vw,8.6rem)/.84 "Manrope";letter-spacing:-.095em;margin:22px 0;animation:fadeUp .8s .3s both}.wrap h1 span{color:transparent;-webkit-text-stroke:1.4px rgba(255,255,255,.92)}.wrap>p{max-width:580px;margin:0 auto;color:var(--muted);line-height:1.75;animation:fadeUp .8s .42s both}.status-strip{width:min(610px,100%);margin:30px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;animation:fadeUp .8s .52s both}.status-strip span{min-height:44px;border:1px solid rgba(255,255,255,.12);border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.045);backdrop-filter:blur(14px);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#dce7e4}.actions{margin-top:38px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;animation:fadeUp .8s .64s both}.actions a{position:relative;overflow:hidden;min-height:54px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;gap:34px;font-size:.72rem;font-weight:800;border:1px solid rgba(255,255,255,.14);transition:transform .35s var(--ease),background .35s,color .35s}.actions a:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.35),transparent 70%);transform:translateX(-120%);transition:transform .75s var(--ease)}.actions a:hover{transform:translateY(-3px)}.actions a:hover:before{transform:translateX(120%)}.actions a:first-child{background:var(--paper);color:#10100f;border-color:var(--paper)}.actions a:last-child{background:rgba(41,199,170,.11);color:#fff}.actions span{transition:transform .35s var(--ease)}.actions a:hover span{transform:translate(3px,-3px)}
    .orbit{position:absolute;width:min(680px,88vw);aspect-ratio:1;border:1px solid rgba(255,255,255,.08);border-radius:50%;left:50%;top:51%;transform:translate(-50%,-50%);z-index:-1;animation:slowSpin 14s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px dashed rgba(255,255,255,.08);border-radius:50%;inset:78px}.orbit:after{inset:160px;border-style:solid}.orbit i{position:absolute;width:10px;height:10px;background:var(--teal);border-radius:50%;left:86px;top:98px;box-shadow:0 0 30px var(--teal)}.orbit b{position:absolute;width:7px;height:7px;background:var(--red);border-radius:50%;right:120px;bottom:138px;box-shadow:0 0 30px var(--red)}
    .floaters{position:fixed;inset:0;pointer-events:none}.floaters i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:.55;animation:float 7s ease-in-out infinite}.floaters i:nth-child(1){left:16%;top:18%}.floaters i:nth-child(2){left:76%;top:16%;background:var(--red);animation-delay:.8s}.floaters i:nth-child(3){left:9%;bottom:20%;animation-delay:1.2s}.floaters i:nth-child(4){right:11%;bottom:18%;background:var(--red);animation-delay:1.8s}
    @keyframes beam{50%,100%{transform:translateX(90%)}}@keyframes markIn{from{opacity:0;filter:blur(14px);transform:translateY(24px) rotateX(35deg) scale(.72)}to{opacity:1;filter:blur(0);transform:none}}@keyframes checkIn{from{opacity:0;transform:scale(.4) rotate(-35deg)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;filter:blur(8px);transform:translateY(24px)}to{opacity:1;filter:blur(0);transform:none}}@keyframes pulse{50%{transform:scale(1.08);opacity:.35}}@keyframes slowSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes float{50%{transform:translateY(-22px) scale(1.3);opacity:.25}}
    @media(max-width:680px){.wrap{padding:44px 0}.mark{width:84px;height:84px;border-radius:24px}.mark img{border-radius:17px}.wrap h1{font-size:17.5vw}.status-strip{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}.actions a{justify-content:space-between}.orbit{width:min(470px,108vw)}.orbit:before{inset:56px}.orbit:after{inset:118px}.beam{inset:-16% -24%}}
    @media(prefers-reduced-motion:reduce){.beam,.orbit,.floaters i,.mark:before,.mark:after{animation:none}.mark,.check,.eyebrow,.wrap h1,.wrap>p,.status-strip,.actions{animation:none}}
  </style>
</head>
